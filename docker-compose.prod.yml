name: tiny_teemo
services:
  redis:
    image: redis:7-alpine
    container_name: tinyteemo_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - teemo-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: tinyteemo_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8766}:8000"
    env_file:
      - .env.prod
    environment:
      UPLOAD_DIR: /data/uploads
      LOG_DIR: /data/logs
      INVALID_ROWS_DIR: /data/invalid_rows
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads:/data/uploads
      - logs:/data/logs
      - invalid_rows:/data/invalid_rows
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - teemo-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: tinyteemo_worker
    restart: unless-stopped
    command: >
      celery -A app.worker.celery_app worker
      --loglevel=info
      --queues=etl.default,etl.dlq
      --concurrency=4
    env_file:
      - .env.prod
    environment:
      UPLOAD_DIR: /data/uploads
      LOG_DIR: /data/logs
      INVALID_ROWS_DIR: /data/invalid_rows
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads:/data/uploads
      - logs:/data/logs
      - invalid_rows:/data/invalid_rows
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - teemo-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Celery Flower (monitoring dashboard) — opt-in only ────────────────────
  # Not started by a plain `docker compose up -d`, used for debugging
  #   docker compose -f docker-compose.prod.yml --profile monitoring up -d flower
  # and stop the container with:
  #   docker compose -f docker-compose.prod.yml --profile monitoring stop flower
  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: tinyteemo_flower
    profiles: [monitoring]
    restart: "no"
    command: >
      celery -A app.worker.celery_app flower
      --port=5555
      --broker=redis://redis:6379/0
    ports:
      - "127.0.0.1:${FLOWER_PORT:-5555}:5555"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    networks:
      - teemo-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  redis_data:
  uploads:
  logs:
  invalid_rows:

networks:
  teemo-net:
    driver: bridge
    name: teemo-network
